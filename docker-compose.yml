services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubedohobby
      POSTGRES_PASSWORD: clubedohobby
      POSTGRES_DB: clubedohobby
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
